

services:
  server:
    container_name: lecturer-consultation-booking-service-container
    image: lecturer-consultation-booking-image
    build:
      context: .
      target: production
    ports:
      - "${SERVER_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env


  db:
    container_name: lecturer-consultation-booking-db-container
    image: postgres:16
    volumes:
      - db-data:/var/lib/postgresql/data
    env_file:
      - .env

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USERNAME} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  db-data:
