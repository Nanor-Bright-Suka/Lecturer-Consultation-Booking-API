spring.application.name=LCBAPI


# Jwt
jwt.secret=${JWT_SECRET_KEY}
jwt.access-token-expiration=${ACCESS_TOKEN_EXPIRATION}
jwt.refresh-token-expiration=${REFRESH_TOKEN_EXPIRATION}


# Admin Seeder
admin.email=${ADMIN_EMAIL}
admin.password=${ADMIN_PASSWORD}
admin.firstName=${ADMIN_FIRSTNAME}
admin.lastName=${ADMIN_LASTNAME}


# Database
spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}



# SCHEDULAR
app.scheduler.availability-window-delay=${AVAILABILITY_WINDOW_DELAY}
app.scheduler.expired-slot-delay=${EXPIRED_SLOT_DELAY}
app.scheduler.outcome-delay=${MEETING_OUTCOME_DELAY}




# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true